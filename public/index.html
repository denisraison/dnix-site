<!-- Inline favicon: terminal prompt on dark, no external request. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='6'%20fill='%230f1113'/%3E%3Ctext%20x='6'%20y='23'%20font-family='monospace'%20font-size='20'%20font-weight='700'%20fill='%237fb1d8'%3E%3E_%3C/text%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/base.css" />
<link rel="stylesheet" href="styles/terminal.css" />
<link rel="stylesheet" href="styles/site.css" />
</head>
<body class="dock-full">
  <!-- traditional page, rendered from js/data.js up front (crawlable) -->
  <main class="site" id="site"></main>

  <!-- terminal, docked to the bottom of the page like an IDE panel.
       three states carried on body: dock-collapsed / dock-open / dock-full -->
  <div class="shell" id="shell">
    <button class="dock-handle" id="dockhandle" type="button" aria-label="toggle terminal">
      <span class="dock-grip">$_</span>
      <span class="dock-hint" id="dockhint">terminal</span>
      <span class="dock-chevron" id="dockchevron" aria-hidden="true">▴</span>
    </button>
    <div class="term">
      <!-- aria-live is set to polite in setReady (terminal.js), AFTER the boot
           typing animation, so screen readers hear command output not the
           character-by-character login sequence. -->
      <div class="screen" id="screen"></div>
      <div class="inputrow" id="inputrow" style="display:none">
        <span class="ps1"><span class="prompt-user">guest</span><span class="muted">@</span><span class="prompt-host">dnix</span><span class="muted">:</span><span class="blue">~</span><span class="prompt-sym">$</span></span>
        <input id="cmdline" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="terminal input" />
        <span class="cursor" id="cursor"></span>
      </div>
      <div class="tmuxbar">
        <span class="tm-sess">[dnix]</span>
        <div class="tm-windows" id="tmwindows"></div>
        <span class="tm-right"><span class="tm-host">guest@dnix.io</span><span id="clock"></span></span>
      </div>
    </div>
  </div>

<script type="module" src="js/main.js"></script>
</body>
</html>
