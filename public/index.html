<!-- The page is JS-rendered, so this block plus /llms.txt is what raw-HTML
     crawlers (most AI ones) get. Keep it in sync with js/data.js. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": "https://dnix.io/#denis",
  "name": "Denis Santos",
  "jobTitle": "Software Engineer",
  "description": "Software engineer in Brisbane who spent years building the ad technology at the heart of retail media (real-time ad serving, sub-millisecond decisioning at millions of requests a second, as a Senior Staff Engineer). Now independent, helping brands understand where their retail media spend goes. Built Shelf Report (shelf.dnix.io).",
  "url": "https://dnix.io/",
  "email": "mailto:denis@dnix.io",
  "address": { "@type": "PostalAddress", "addressLocality": "Brisbane", "addressCountry": "AU" },
  "knowsAbout": ["retail media", "ad technology", "sponsored product ads", "ad serving", "retail media measurement", "Go", "TypeScript", "PostgreSQL", "system design"],
  "sameAs": [
    "https://github.com/denisraison",
    "https://www.linkedin.com/in/denisraison"
  ]
}
</script>
<!-- Inline favicon: a prompt on the signal-yellow field, no external request. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%23ffd60a'/%3E%3Ctext%20x='5'%20y='23'%20font-family='monospace'%20font-size='20'%20font-weight='700'%20fill='%230c0c0b'%3E%3E_%3C/text%3E%3C/svg%3E" />
<meta name="theme-color" content="#0c0c0b" />
<link rel="preload" href="fonts/martian-mono.ttf" as="font" type="font/ttf" crossorigin />
<link rel="stylesheet" href="styles/base.css" />
<link rel="stylesheet" href="styles/terminal.css" />
<link rel="stylesheet" href="styles/site.css" />
</head>
<body>
  <!-- One tmux session: the hero pane (h1 + a live prompt), the Shelf pane and
       the auction pane, then the scrollback. Everything is rendered from
       js/data.js up front and stays in the DOM (crawlable). -->
  <main class="site" id="site">
    <div class="session" id="session">
      <section class="pane pane-hero is-focus" id="pane-hero" aria-label="dnix">
        <div class="hero-head" id="herohead"></div>
        <!-- aria-live is set to polite in setReady (terminal.js), after the
             login lines, so screen readers hear command output only. -->
        <div class="screen" id="screen"></div>
        <div class="inputrow" id="inputrow" hidden>
          <label class="ps1" for="cmdline"><span class="ps1-user">guest@dnix:</span>~$</label>
          <span class="field">
            <input id="cmdline" aria-label="terminal input" aria-describedby="hint" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" />
            <span class="cursor" aria-hidden="true"></span>
          </span>
          <button class="enter" id="enter" type="button">email me</button>
        </div>
        <p class="hint" id="hint"></p>
      </section>
      <section class="pane pane-shelf" id="pane-shelf" tabindex="-1" aria-labelledby="shelf-title"></section>
      <section class="pane pane-auction" id="pane-auction" tabindex="-1" aria-label="auction log, a synthetic replay"></section>
    </div>
    <div class="scrollback" id="scrollback"></div>
  </main>

  <noscript>
    <p class="noscript">The page is drawn with JavaScript. The plain-text version is at <a href="/llms.txt">/llms.txt</a>, or email <a href="mailto:denis@dnix.io">denis@dnix.io</a>.</p>
  </noscript>

  <!-- tmux status bar: the windows are the navigation, pinned to the thumb zone. -->
  <nav class="tmuxbar" aria-label="sections">
    <span class="tm-sess">[dnix]</span>
    <div class="tm-windows" id="tmwindows"></div>
    <span class="tm-prefix" id="tmprefix" hidden>^b</span>
    <span class="tm-right"><span class="tm-host">guest@dnix.io</span><span id="clock"></span></span>
  </nav>

<script type="module" src="js/main.js"></script>
</body>
</html>
